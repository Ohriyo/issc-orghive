name: CI

on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Repository tests run against a real Postgres; they create and migrate orghive_test.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orghive
          POSTGRES_PASSWORD: orghive-ci-password
          POSTGRES_DB: orghive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orghive -d orghive"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://orghive:orghive-ci-password@localhost:5432/orghive_test
      REDIS_URL_TEST: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v6

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Responsive and accessibility rules from CLAUDE.md: every public route at 360, 768,
  # 1366 and 1920 px must not scroll sideways, every button/link must be at least 44x44px,
  # and axe must find no WCAG 2.2 AA violations. The API is stubbed in the browser, so no
  # database or storage services are needed.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/e2e/playwright-report
            apps/web/e2e/test-results
          retention-days: 7
